[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfbench-smoke"
version = "0.2.0"
description = "Bounded CPU checks for dfbench reference and candidate optimizers"
readme = "README.md"
license-files = ["NOTICE", "third_party/learn2design-MIT.txt"]
requires-python = ">=3.12,<3.14"
dependencies = ["dfbench==0.3.3", "jax==0.9.0.1", "jaxlib==0.9.0.1", "optax==0.2.8", "numpy==2.5.3", "scipy==1.18.1"]

[project.scripts]
dfbench-smoke = "dfbench_smoke.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dfbench_smoke.vendor" = ["UPSTREAM.json"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/dfbench_smoke/vendor", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
line-ending = "lf"
