name: CPU reference smoke
run-name: CPU smoke (${{ inputs.problem }}, ${{ inputs.method }})

"on":
  workflow_dispatch:
    inputs:
      problem:
        description: Public problem to exercise
        required: true
        default: cvoyager
        type: choice
        options: [cvoyager, uifo]
      method:
        description: Unmodified organizer reference method
        required: true
        default: adam
        type: choice
        options: [adam, random]

permissions:
  contents: read

concurrency:
  group: cpu-reference-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: dfbench-smoke:${{ github.sha }}
      PROBLEM: ${{ inputs.problem }}
      METHOD: ${{ inputs.method }}
      BUDGET_SECONDS: ${{ inputs.problem == 'uifo' && '300' || '120' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the test environment
        run: docker build --tag "$IMAGE" .
      - name: Run unit and provenance tests
        run: |
          docker run --rm --init --network none --memory 1g --memory-swap 1g \
            --cpus 2 --pids-limit 256 --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --entrypoint python "$IMAGE" -m unittest discover -s tests -v
      - name: Run one full public-problem smoke
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker create --init --network none --memory 8g --memory-swap 8g \
            --cpus 2 --pids-limit 256 --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g,mode=1777 \
            "$IMAGE" --problem "$PROBLEM" --method "$METHOD" \
            --seconds "$BUDGET_SECONDS" --seed 42 --require-feasible)"
          cleanup() {
            status=$?
            if ! docker inspect --format '{{json .State}}' "$container"; then
              [ "$status" -ne 0 ] || status=1
            fi
            if ! docker rm --force "$container" >/dev/null; then
              [ "$status" -ne 0 ] || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          timeout --signal=TERM --kill-after=15s 12m docker start --attach "$container"
