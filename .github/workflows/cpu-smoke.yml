name: CPU optimizer check
run-name: CPU smoke (${{ inputs.problem }}, ${{ inputs.method }})

"on":
  workflow_dispatch:
    inputs:
      problem:
        description: Public problem to exercise
        required: true
        default: cvoyager
        type: choice
        options: [cvoyager, uifo]
      method:
        description: Optimizer check or a fixed reference-candidate comparison
        required: true
        default: adam
        type: choice
        options: [adam, random, hybrid, compare]

permissions:
  contents: read

concurrency:
  group: cpu-reference-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: dfbench-smoke:${{ github.sha }}
      PROBLEM: ${{ inputs.problem }}
      METHOD: ${{ inputs.method }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the test environment
        run: docker build --tag "$IMAGE" .
      - name: Run unit and provenance tests
        run: |
          docker run --rm --init --network none --memory 1g --memory-swap 1g \
            --cpus 2 --pids-limit 256 --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --entrypoint python "$IMAGE" -m unittest discover -s tests -v
      - name: Run bounded optimizer checks
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m dfbench_smoke.ci --image "$IMAGE" --problem "$PROBLEM" --method "$METHOD" --seed 42
